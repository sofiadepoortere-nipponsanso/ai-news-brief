name: Daily AI News Brief

on:
  schedule:
    # Runs at 06:00 UTC every day. GitHub Actions cron is always UTC —
    # adjust this number to line up with your local morning.
    # e.g. for 7am in a UTC+2 timezone, use '0 5 * * *'
    - cron: '0 6 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab, for testing

permissions:
  contents: write   # needed so the workflow can commit the updated site back to the repo

jobs:
  build-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch news, rank top 5, build site, notify Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/fetch_news.py

      - name: Commit updated site back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Update daily AI news brief" || echo "No changes to commit"
          git push
